# The three bundled Qwen2.5-Coder models (small/medium/large) -- a fixed,
# curated suite, never an arbitrary user-supplied model path. Verified on
# Hugging Face 2026-10-09 (not blog figures); file_size_bytes is read back
# from disk after download, not quoted from the model card.
#
# llama_cpp pins an exact numbered release (not "latest") per
# DWARV_PLAN.md's "pin the build" requirement -- llama.cpp's flags/defaults
# change often between builds.
#
# measured_rss_mb / load_time_s come from scripts/benchmark_models.py, a
# single consistent run (not separate ad-hoc measurements) --
# see benchmarks/history/20261009T083427Z/ for the full CSV + charts, and
# benchmarks/README.md for how to reproduce or add a new run.

llama_cpp:
  release_tag: b11516
  release_url_base: https://github.com/ggml-org/llama.cpp/releases/download/b11516
  assets: # (platform.system(), platform.machine()) -> [asset filename, archive type, executable name]
    "Windows,AMD64": [llama-b11516-bin-win-cpu-x64.zip, zip, llama-server.exe]
    "Windows,ARM64": [llama-b11516-bin-win-cpu-arm64.zip, zip, llama-server.exe]
    "Linux,x86_64": [llama-b11516-bin-ubuntu-x64.tar.gz, tar.gz, llama-server]
    "Darwin,x86_64": [llama-b11516-bin-macos-x64.tar.gz, tar.gz, llama-server]
    "Darwin,arm64": [llama-b11516-bin-macos-arm64.tar.gz, tar.gz, llama-server]
  # DWARV_PLAN.md section 11.3: optional GPU-offload build, downloaded in
  # addition to (never instead of) the CPU-only asset above, and only used
  # when a GPU is actually detected (see dwarv.cli._detect_nvidia_vram_mb)
  # -- machines without a detected GPU are completely unaffected. Vulkan,
  # not CUDA: the CUDA asset for this same release needs an extra ~650MB
  # (a separate win-cuda build plus its own cudart redistributable) and is
  # NVIDIA-only; the Vulkan asset is 33MB with no separate runtime and
  # works across NVIDIA/AMD/Intel GPUs (sizes confirmed via the GitHub
  # releases API 2026-10-10, not guessed). Live-verified on this machine's
  # real RTX 3050 (llama-bench, -ngl 99 vs -ngl 0): 8.4x/9.7x/5.5x faster
  # token generation for small/medium/large respectively -- see
  # docs/DECISIONS.md. Windows,AMD64 is live-verified; Linux,x86_64's
  # asset exists in the same release but was not live-tested this
  # session (no Linux GPU machine available) -- included because the
  # same release build process produced it, not because it was run.
  vulkan_assets:
    "Windows,AMD64": [llama-b11516-bin-win-vulkan-x64.zip, zip, llama-server.exe]
    "Linux,x86_64": [llama-b11516-bin-ubuntu-vulkan-x64.tar.gz, tar.gz, llama-server]

models:
  - id: small
    family: Qwen2.5-Coder
    hf_repo: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
    filename: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
    quant: Q4_K_M
    license: apache-2.0
    file_size_bytes: 1117320768
    ctx_sizes_tested: [4096]
    measured_rss_mb:
      4096: 1727.3
    load_time_s:
      4096: 6.03
    # DWARV_PLAN.md section 11.6: lower-footprint quants for machines the
    # default Q4_K_M doesn't fit. Qwen's own official repo publishes no
    # I-quants at all (verified via the HF API); these come from
    # bartowski's repo, a well-known community quantizer -- real file
    # sizes verified via the HF API's blobs=true listing 2026-10-10, not
    # quoted from a model card. estimated_rss_mb is computed in
    # models/suite.py (file_size_bytes x a conservative factor derived
    # from our own real measured_rss_mb/file_size_bytes ratios above),
    # not independently measured -- see suite.py's own docstring for why,
    # and benchmarks/ for the real-vs-estimate check once a level is
    # actually live-tested (small/IQ2_M, per docs/DECISIONS.md).
    quants:
      - level: IQ4_XS
        hf_repo: bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF
        filename: Qwen2.5-Coder-1.5B-Instruct-IQ4_XS.gguf
