# The three bundled Qwen2.5-Coder models (small/medium/large). Filled in during
# Step 1 (Offline-ready environment) and Step 3 (measured RSS table). This is a
# fixed, curated suite -- never an arbitrary user-supplied model path.
#
# Each entry:
#   id: short identifier used elsewhere (systems.yaml, controller state, models/suite.py)
#   path: path to the .gguf file under ./cache/models/
#   family: model family (Qwen2.5-Coder), so only size varies across small/medium/large
#   quant: quantization (e.g. Q4_K_M)
#   file_size_mb: verified on disk, not from blog posts
#   ctx_sizes_tested: list of context sizes this entry has been profiled at
#   measured_rss_mb: { <ctx_size>: rss_mb } -- measured during Step 3, drives Step 5's choice
#   load_time_s: { <ctx_size>: seconds } -- measured during Step 3
models: []
