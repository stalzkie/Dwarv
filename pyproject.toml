[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwarv"
version = "0.1.0"
description = "A local, conversational coding assistant with a hardware-aware, bundled model suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "psutil>=6.0.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.2",
  "rich>=13.9.2",
  "typer>=0.12.5",
  "pandas>=2.2.3",
  "matplotlib>=3.9.2",
  "evalplus>=0.3.1",
]

[project.optional-dependencies]
gui = [
  "fastapi>=0.115.0",
  "uvicorn>=0.31.0",
]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[project.scripts]
dwarv = "dwarv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dwarv"]

[tool.pytest.ini_options]
# Without this, bare `pytest -q` (what CI runs) discovers test_*.py anywhere
# under the repo root -- including scripts/demo_repo_template/tests/, which
# is demo fixture content (copied into a disposable tmp dir at demo time,
# never meant to be collected by the project's own suite) and fails collection
# with the exact pytest import-path issue documented in docs/DECISIONS.md.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
