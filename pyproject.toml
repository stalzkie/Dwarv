[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwarv"
version = "0.1.0"
description = "Resource-aware, verification-guided local AI controller for offline coding tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "psutil>=6.0.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.2",
  "rich>=13.9.2",
  "typer>=0.12.5",
  "pandas>=2.2.3",
  "matplotlib>=3.9.2",
  "evalplus>=0.3.1",
]

[project.optional-dependencies]
gui = [
  "fastapi>=0.115.0",
  "uvicorn>=0.31.0",
]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[project.scripts]
dwarv = "dwarv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dwarv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
