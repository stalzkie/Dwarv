<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dwarv -- session transparency</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="terminal">
    <div class="terminal-bar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <img src="/logo.png" alt="Dwarv" class="terminal-logo" />
      <span class="terminal-title">dwarv — session transparency</span>
    </div>

    <div class="terminal-output" id="terminal-output"></div>

    <div class="terminal-statusbar">
      <span id="status-flow" class="status-item">flow: --</span>
      <span id="status-model" class="status-item">model: --</span>
      <span id="status-tier" class="status-item">tier: --</span>
      <canvas id="rss-chart" width="120" height="24"></canvas>
      <span id="status-rss" class="status-item status-rss">rss: --</span>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
